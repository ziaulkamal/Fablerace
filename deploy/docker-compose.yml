# Dev & prod single-node (docs/09-devops.md §1).
# Jalankan dari root repo:  docker compose -f deploy/docker-compose.yml up --build
# Default di bawah aman untuk DEV; override via environment/.env untuk prod
# (prod juga menambah reverse proxy Caddy untuk TLS — docs/09 §1).

name: fablerace

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://fablerace:${POSTGRES_PASSWORD:-fablerace}@postgres:5432/fablerace?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-fablerace}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fablerace-secret}
      MINIO_BUCKET: fablerace
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fablerace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fablerace}
      POSTGRES_DB: fablerace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fablerace -d fablerace"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fablerace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fablerace-secret}
    ports:
      - "9000:9000"   # S3 API (dibutuhkan presigned URL dari browser)
      - "9001:9001"   # Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
